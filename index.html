<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Picker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="topbar">
        <div>
          <div class="brand">GROUP PICKER</div>
          <div class="sub">Chia nhóm công bằng • Kết quả khớp animation</div>
        </div>
        <button id="adminBtn" class="btn btn-outline">Admin</button>
      </div>

      <div class="picker">
        <label for="memberName">Nhập tên của bạn</label>
        <input id="memberName" autocomplete="off" placeholder="Ví dụ: Bùi Huỳnh Băng">
        <button id="spinBtn" class="btn btn-primary">QUAY VÒNG</button>
        <div id="status" class="status"></div>
      </div>

      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="560" height="560"></canvas>
      </div>

      <div id="result" class="result hidden">
        <div class="result-label">KẾT QUẢ</div>
        <div id="resultGroup" class="result-group"></div>
      </div>
    </section>
  </main>

  <div id="loginModal" class="modal hidden">
    <div class="modal-box">
      <button class="close" id="closeLogin">×</button>
      <h2>Đăng nhập Admin</h2>
      <input id="adminPassword" type="password" placeholder="Mật khẩu">
      <button id="loginBtn" class="btn btn-primary">Đăng nhập</button>
      <div id="loginError" class="error"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
